name: Keelflow end-to-end check
description: Installs dependencies, restores the build from the build job, starts the server and runs a test script against it.
inputs:
    cache:
        description: Enable the pnpm cache for ordinary CI
        default: "true"
    command:
        description: Test command, run from packages/server while the server listens on port 3000
        required: true
runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
          with:
              version: 10.26.0
        - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
          with:
              node-version: 24
              cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
              package-manager-cache: ${{ inputs.cache == 'true' }}
        - shell: bash
          run: pnpm install --frozen-lockfile
          env:
              PUPPETEER_SKIP_DOWNLOAD: 'true'
              CYPRESS_INSTALL_BINARY: '0'
              HUSKY: '0'
        - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
          with:
              name: build
              path: packages
        - shell: bash
          working-directory: packages/server
          run: |
              mkdir -p "$RUNNER_TEMP/keelflow-home"
              export KEELFLOW_HOME="$RUNNER_TEMP/keelflow-home" PORT=3000
              SERVER_LOG="$RUNNER_TEMP/server.log" bash test/run-with-server.sh ${{ inputs.command }}
