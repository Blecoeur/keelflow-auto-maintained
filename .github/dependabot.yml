version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
          day: monday
      cooldown:
          default-days: 1
      rebase-strategy: disabled
      open-pull-requests-limit: 5
      ignore:
          - dependency-name: '*'
            update-types: ['version-update:semver-major']
          # @langchain/mistralai 1.2.x requires @langchain/core >= 1.2.
          - dependency-name: '@langchain/mistralai'
            update-types: ['version-update:semver-minor']
      groups:
          security:
              applies-to: security-updates
              patterns: ['*']
          production-patch:
              applies-to: version-updates
              dependency-type: production
              update-types: [patch]
          production-minor:
              applies-to: version-updates
              dependency-type: production
              update-types: [minor]
          development:
              applies-to: version-updates
              dependency-type: development
              update-types: [patch, minor]

    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: weekly
          day: monday
      cooldown:
          default-days: 1
      ignore:
          - dependency-name: '*'
            update-types: ['version-update:semver-major']
      groups:
          security:
              applies-to: security-updates
              patterns: ['*']
          actions:
              applies-to: version-updates
              patterns: ['*']
              update-types: [patch, minor]

    - package-ecosystem: docker
      directories: ['/', '/docker']
      schedule:
          interval: weekly
          day: monday
      cooldown:
          default-days: 1
      ignore:
          - dependency-name: '*'
            update-types: ['version-update:semver-major']
      groups:
          security:
              applies-to: security-updates
              patterns: ['*']
          docker:
              applies-to: version-updates
              patterns: ['*']
              update-types: [patch, minor]
