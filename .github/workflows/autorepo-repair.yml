name: Propose an Autorepo repair
run-name: >-
    ${{ format('Autorepo repair #{0} {1} {2}', inputs.pr, inputs.head, github.sha) }}

on:
    workflow_dispatch:
        inputs:
            pr:
                description: Open Dependabot PR number
                type: string
                required: true
            head:
                description: Exact head SHA from the failed selected validation
                type: string
                required: true
            validation_run:
                description: Failed Autorepo validation run ID
                type: string
                required: true
            paths:
                description: Suggested repair paths, separated by spaces
                type: string
                required: false
            diagnosis:
                description: Reproduced compatibility error with credentials removed
                type: string
                required: true
            confirmed:
                description: The failure is a reproduced dependency incompatibility
                type: boolean
                required: true

permissions:
    actions: read
    contents: read
    pull-requests: read

concurrency:
    group: autorepo-repair-${{ inputs.pr }}
    cancel-in-progress: false

jobs:
    propose:
        if: github.ref == 'refs/heads/main' && vars.AUTOREPO_REPAIR_ENABLED == 'true' && inputs.confirmed
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: autorepo-repair
        env:
            VIBE_SYSTEM_PROMPT_ID: minimal
            VIBE_DISABLED_TOOLS: '["web_search","web_fetch","task","skill","todo","ask_user_question","git_bash","experimental_bash","windows_shell"]'
        steps:
            - uses: Blecoeur/autorepo/repair@5322c689611e7111bb1a1f304c1a1b31b01a16d2
              id: repair
              with:
                  pr: ${{ inputs.pr }}
                  head: ${{ inputs.head }}
                  validation-run: ${{ inputs.validation_run }}
                  paths: ${{ inputs.paths }}
                  diagnosis: ${{ inputs.diagnosis }}
                  confirmed: ${{ inputs.confirmed }}
                  repairable-jobs: |
                      Lint, build and unit tests
                      dependency-audit
                  api-key: ${{ secrets.MISTRAL_API_KEY }}
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: repair-pr-${{ inputs.pr }}-${{ github.run_attempt }}
                  path: ${{ steps.repair.outputs.artifact-path }}
                  if-no-files-found: error
                  retention-days: 7
