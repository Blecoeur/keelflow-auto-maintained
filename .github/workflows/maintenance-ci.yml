name: Maintenance CI
on:
    pull_request:
        branches: [main]
permissions:
    pull-requests: read
jobs:
    maintenance-policy:
        name: maintenance-policy / maintenance-policy
        runs-on: ubuntu-latest
        timeout-minutes: 2
        steps:
            - name: Enforce supervised maintenance
              if: github.event.pull_request.user.id == 49699333
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR: ${{ github.event.pull_request.number }}
              run: |
                  gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" |
                    jq -e '.auto_merge == null' ||
                    { echo 'Disable native auto-merge on this maintenance PR'; exit 1; }
