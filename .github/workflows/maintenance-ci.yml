# Maintenance policy check for the Keelflow demonstrator.
#
# The repository keeps its own CI (main.yml: lint/build/unit tests + e2e);
# this workflow adds the framework's policy decision as a required check
# on every PR. The configuration is read from the base branch, PR facts are
# collected via the GitHub API, and no PR code is executed here.

name: Maintenance CI

on:
    pull_request:
        branches: [main]

permissions:
    contents: read
    pull-requests: read

jobs:
    maintenance-policy:
        if: github.event_name == 'pull_request'
        uses: Blecoeur/autonomous-dependency-maintainer/.github/workflows/policy-check.yml@v0.1.1
        with:
            pr-number: ${{ github.event.pull_request.number }}
            base-ref: ${{ github.event.pull_request.base.ref }}
            head-sha: ${{ github.event.pull_request.head.sha }}
            framework-repository: Blecoeur/autonomous-dependency-maintainer
            framework-ref: v0.1.1
