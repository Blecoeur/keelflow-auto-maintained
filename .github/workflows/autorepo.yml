name: Autorepo
on:
    pull_request_target:
        branches: [main]
        types: [opened, reopened, synchronize, ready_for_review, closed]
    workflow_run:
        workflows: [CI]
        types: [completed]
        branches: [main]
    push:
        branches: [main]
    schedule:
        - cron: '11,26,41,56 * * * *'
    workflow_dispatch:

permissions:
    actions: write
    contents: write
    pull-requests: write
    statuses: write

concurrency:
    group: autorepo-controller
    cancel-in-progress: false

jobs:
    reconcile:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (vars.AUTOREPO_AUTOMATIC != 'false' &&
             (github.event_name != 'pull_request_target' ||
              (github.event.pull_request.user.id == 49699333 &&
               github.event.pull_request.head.repo.full_name == github.repository)))
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Get repository-scoped Dependabot alerts token
              if: vars.AUTOREPO_ALERTS_APP_CLIENT_ID != ''
              id: alerts
              uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
              with:
                  client-id: ${{ vars.AUTOREPO_ALERTS_APP_CLIENT_ID }}
                  private-key: ${{ secrets.AUTOREPO_ALERTS_APP_PRIVATE_KEY }}
                  permission-vulnerability-alerts: read
            - name: Reconcile maintenance backlog
              uses: Blecoeur/autorepo@8d60d0bc795883d2123972a9340e2f0f8910528d
              with:
                  alerts-token: ${{ steps.alerts.outputs.token }}
